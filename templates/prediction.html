<h1>Prediction</h1>
<p>Select a crop and upload an image to get predictions:</p>

<div id="cropButtons">
  <button class="crop-btn" onclick="showUpload('tomato')">🍅 Tomato</button>
  <button class="crop-btn" onclick="showUpload('cherry')">🍒 Cherry</button>
  <button class="crop-btn" onclick="showUpload('apple')">🍏 Apple</button>
  <button class="crop-btn" onclick="showUpload('pepper')">🌶 Pepper</button>
  <button class="crop-btn" onclick="showUpload('potato')">🥔 Potato</button>
  <button class="crop-btn" onclick="showUpload('blueberry')">🫐 Blueberry</button>
  <button class="crop-btn" onclick="showUpload('corn')">🌽 Corn</button>
  <button class="crop-btn" onclick="showUpload('grape')">🍇 Grape</button>
  <button class="crop-btn" onclick="showUpload('orange')">🍊 Orange</button>
  <button class="crop-btn" onclick="showUpload('peach')">🍑 Peach</button>
  <button class="crop-btn" onclick="showUpload('raspberry')">🍓 Raspberry</button>
  <button class="crop-btn" onclick="showUpload('soybean')">🌱 Soybean</button>
  <button class="crop-btn" onclick="showUpload('squash')">🎃 Squash</button>
  <button class="crop-btn" onclick="showUpload('strawberry')">🍓 Strawberry</button>
</div>

<div id="uploadSection" style="margin-top:20px; display:none;">
  <h3 id="selectedCrop"></h3>
  <input type="file" id="imageUpload">
  <br><br>
  <button class="crop-btn" onclick="uploadImage()">Get Prediction</button>
  <p id="predictionResult" style="font-weight:bold; margin-top:10px;"></p>
</div>
