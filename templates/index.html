<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafCare Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Google Translate widget at top-right */
    #google_translate_element {
      position: absolute;
      top: 10px;
      right: 20px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- Google Translate Widget -->
  <div id="google_translate_element"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',                     // default language
        includedLanguages: 'en,ml,ta,kn,hi',   // languages allowed
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar"id="sidebar">
    <button id="toggleSidebar" class="toggle-btn">☰</button>
      <h2>LeafCare</h2>
      <ul>
        <li class="active" onclick="showTab('home')">Home</li>
        <li onclick="showTab('prediction')">Prediction</li>
        <li onclick="showTab('qa')">Q&A</li>
      </ul>
    </div>
    
    <!-- Main content -->
    <div class="main-content">
      <div id="home" class="tab">{% include 'home.html' %}</div>
      <div id="prediction" class="tab" style="display:none;">{% include 'prediction.html' %}</div>
      <div id="qa" class="tab" style="display:none;">{% include 'qa.html' %}</div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
